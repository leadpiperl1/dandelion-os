name: Dandelion Sovereign Substrate CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify-living-trunk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Living Trunk
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NumPy
        run: python3 -m pip install --upgrade pip numpy

      - name: Compile C11 Argon Methylation Kernel & Run Seed-42 Verification
        run: make -f Makefile all
