name: Dandelion 5-Point CI Contract
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  verify-c99-and-waveguides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: pip install numpy
      - name: Run Zero-Warning C99 & Python Verification Gates
        run: make verify
