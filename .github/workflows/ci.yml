name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-check:
    name: Portable verification (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build and validate (${{ matrix.compiler }})
        env:
          CC: ${{ matrix.compiler }}
        run: make check

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-os-${{ matrix.compiler }}-artifacts
          path: |
            build/
            audit_manifest_v3.0.0.json
          if-no-files-found: error

  strict-check:
    name: Strict maintainer audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run strict build validation
        run: make check-strict

      - name: Upload strict artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-os-strict-artifacts
          path: |
            build/
            audit_manifest_v3.0.0.json
          if-no-files-found: error
