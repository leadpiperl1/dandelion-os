name: Dandelion OS CI & Verification Gate (v4.1.1)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify-c99-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile & Verify C99 Kernel Modules (-Werror)
        run: |
          make clean
          make all
          make test
