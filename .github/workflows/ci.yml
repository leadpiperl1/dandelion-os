name: Dandelion OS C99 & 16-Gate Verification Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Verify C99 Kernels & 16-Gate FFI Suite
        run: |
          make clean
          make all
          make test
