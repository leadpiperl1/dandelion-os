name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install verification dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Clean prior build state
        run: make clean

      - name: Build with ${{ matrix.compiler }}
        run: make build CC=${{ matrix.compiler }}

      - name: Run portable verification suite
        run: make check CC=${{ matrix.compiler }}

      - name: Run strict verification gate
        run: make check-strict CC=${{ matrix.compiler }}
